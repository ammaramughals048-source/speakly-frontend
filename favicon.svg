<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFD70000"/>
    </radialGradient>
  </defs>
  <!-- Glow background -->
  <ellipse cx="50" cy="52" rx="44" ry="46" fill="url(#glow)" opacity="0.4"/>
  <!-- Body -->
  <ellipse cx="50" cy="54" rx="36" ry="40" fill="#FFD700" stroke="#111" stroke-width="3"/>
  <!-- Left Eye -->
  <circle cx="37" cy="45" r="9" fill="white" stroke="#111" stroke-width="2"/>
  <circle cx="37" cy="45" r="4" fill="#111"/>
  <!-- Right Eye -->
  <circle cx="63" cy="45" r="9" fill="white" stroke="#111" stroke-width="2"/>
  <circle cx="63" cy="45" r="4" fill="#111"/>
  <!-- Beak -->
  <polygon points="50,60 44,68 56,68" fill="#FF7F7F"/>
</svg>